apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: ner-landslide
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: ner-landslide-worker:latest
        command: ["celery", "-A", "worker.app", "worker", "-l", "INFO"]
        envFrom:
        - configMapRef:
            name: ner-config
        - secretRef:
            name: ner-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
