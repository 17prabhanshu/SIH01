[project]
name = "ner-landslide-early-warning"
version = "0.1.0"
description = "NER Landslide Early Warning platform"
authors = [{name = "NER Admin"}]
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=./ --cov-report=term-missing"
